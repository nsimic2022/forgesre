services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_USER: forgesre
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: forgesre
    command: ["postgres", "-c", "listen_addresses=127.0.0.1"]
    volumes:
      - ${FORGESRE_DATA:-./data}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U forgesre"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    network_mode: host
    env_file:
      - .env
      - secrets/secrets.env
    environment:
      DATABASE_URL: postgresql+psycopg2://forgesre:${POSTGRES_PASSWORD}@127.0.0.1:5432/forgesre
      FORGESRE_CONFIG: /config/forgesre.yml
      FORGESRE_LOG_FILE: /logs/forgesre.log
      FRONTEND_DIR: /frontend
      PROMETHEUS_URL: http://127.0.0.1:9090
      LOKI_URL: http://127.0.0.1:3100
      ALERTMANAGER_URL: http://127.0.0.1:9093
      GRAFANA_PUBLIC_URL: http://localhost:${GRAFANA_PORT:-3000}
      NETBOX_URL: ${NETBOX_URL:-http://127.0.0.1:8001}
      FORGESRE_BACKUP_DIR: /backups
      FORGESRE_DOTENV: /host-dotenv
      FORGESRE_SECRETS_FILE: /host-secrets.env
      FORGESRE_MONITORING_DIR: /host-monitoring
      FORGESRE_GENERATED_DIR: /host-generated
      FORGESRE_MODELS_DIR: /host-models
      FORGESRE_LOGS_DIR: /logs
      FORGESRE_FILES_WRITABLE: "0"
    volumes:
      - ./config/forgesre.yml:/config/forgesre.yml:ro
      - ${FORGESRE_DATA:-./data}/logs:/logs
      - ${FORGESRE_DATA:-./data}/backups:/backups
      - ./.env:/host-dotenv:ro
      - ./secrets/secrets.env:/host-secrets.env:ro
      - ./monitoring:/host-monitoring:ro
      - ${FORGESRE_DATA:-./data}/generated:/host-generated:ro
      - ${FORGESRE_DATA:-./data}/models:/host-models:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port ${FORGESRE_HTTP_PORT:-8080}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/api/v1/health' % os.environ.get('FORGESRE_HTTP_PORT','8080'))"]
      interval: 10s
      timeout: 5s
      retries: 15
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    user: "0"
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ${PROMETHEUS_CONFIG:-./monitoring/prometheus.yml}:/etc/prometheus/prometheus.yml:ro
      - ${PROMETHEUS_ALERTS:-./monitoring/alerts.yml}:/etc/prometheus/alerts.yml:ro
      - ${FORGESRE_DATA:-./data}/prometheus:/prometheus
    depends_on:
      - core
      - snmp-exporter
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    user: "0"
    network_mode: host
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.listen-address=127.0.0.1:9093
    volumes:
      - ${ALERTMANAGER_CONFIG:-./monitoring/alertmanager.yml}:/etc/alertmanager/alertmanager.yml:ro
      - ${FORGESRE_DATA:-./data}/alertmanager:/alertmanager
    depends_on:
      - core
    restart: unless-stopped

  snmp-exporter:
    # Default stack service (not a profile). Host network publishes 127.0.0.1:9116.
    image: prom/snmp-exporter:v0.26.0
    user: "0"
    network_mode: host
    command:
      - --config.file=/etc/snmp_exporter/snmp.yml
      - --web.listen-address=127.0.0.1:9116
    volumes:
      - ${SNMP_EXPORTER_CONFIG:-./monitoring/snmp.yml}:/etc/snmp_exporter/snmp.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9116/metrics"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  loki:
    image: grafana/loki:3.4.2
    user: "0"
    network_mode: host
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./logging/loki.yml:/etc/loki/loki.yml:ro
      - ${FORGESRE_DATA:-./data}/loki:/loki
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.7.5
    user: "0"
    network_mode: host
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=127.0.0.1:12345
    volumes:
      - ./logging/config.alloy:/etc/alloy/config.alloy:ro
      - ${FORGESRE_DATA:-./data}/logs:/var/log/forgesre:ro
      - ${FORGESRE_DATA:-./data}/alloy:/var/lib/alloy/data
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.4.0
    user: "0"
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_HTTP_PORT: ${GRAFANA_PORT:-3000}
      GF_SERVER_ROOT_URL: http://localhost:${GRAFANA_PORT:-3000}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ${FORGESRE_DATA:-./data}/grafana:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  netbox-redis:
    # Default stack (not a profile). NetBox needs Redis; ForgeSRE Core does not.
    image: redis:7-alpine
    network_mode: host
    env_file:
      - secrets/secrets.env
    environment:
      NETBOX_REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}
      REDISCLI_AUTH: ${NETBOX_REDIS_PASSWORD}
    command:
      - sh
      - -c
      - redis-server --bind 127.0.0.1 --port 6379 --save 60 1 --loglevel warning --requirepass "$$NETBOX_REDIS_PASSWORD"
    volumes:
      - ${FORGESRE_DATA:-./data}/netbox/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  netbox-db-init:
    # CREATE DATABASE netbox on the existing Postgres. Does not touch database forgesre.
    image: postgres:16-alpine
    network_mode: host
    env_file:
      - secrets/secrets.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      NETBOX_DB_PASSWORD: ${NETBOX_DB_PASSWORD}
    volumes:
      - ./scripts/netbox-db-init.sh:/netbox-db-init.sh:ro
    entrypoint: ["/bin/sh", "/netbox-db-init.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  netbox:
    # Default stack (not a profile). Host network; Granian on :8001 (Core owns :8080).
    # First boot runs Django migrations — doctor stays yellow until /login/ answers.
    # Pin is NetBox 4.6.9 + netbox-docker 5.0.2 (Granian, user netbox). The old
    # v4.4-3.2.0 tag never existed on Docker Hub (3.2.0 was v4.2 / nginx unit).
    image: docker.io/netboxcommunity/netbox:v4.6.9-5.0.2
    network_mode: host
    user: "netbox:root"
    env_file:
      - secrets/secrets.env
    environment:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: netbox
      DB_USER: netbox
      DB_PASSWORD: ${NETBOX_DB_PASSWORD}
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "6379"
      REDIS_DATABASE: "0"
      REDIS_PASSWORD: ${NETBOX_REDIS_PASSWORD}
      REDIS_CACHE_HOST: 127.0.0.1
      REDIS_CACHE_PORT: "6379"
      REDIS_CACHE_DATABASE: "1"
      REDIS_CACHE_PASSWORD: ${NETBOX_REDIS_PASSWORD}
      REDIS_SSL: "false"
      REDIS_CACHE_SSL: "false"
      SECRET_KEY: ${NETBOX_SECRET_KEY}
      ALLOWED_HOSTS: "* localhost 127.0.0.1 ::1"
      CORS_ORIGIN_ALLOW_ALL: "true"
      SKIP_SUPERUSER: "false"
      SUPERUSER_NAME: ${NETBOX_SUPERUSER_NAME:-admin}
      SUPERUSER_EMAIL: ${NETBOX_SUPERUSER_EMAIL:-admin@forgesre.local}
      SUPERUSER_PASSWORD: ${NETBOX_SUPERUSER_PASSWORD}
      SUPERUSER_API_TOKEN: ${NETBOX_API_TOKEN}
      NETBOX_HTTP_PORT: ${NETBOX_PORT:-8001}
      GRANIAN_WORKERS: "2"
      MAX_DB_WAIT_TIME: "180"
      DB_WAIT_TIMEOUT: "3"
      RELEASE_CHECK_URL: ""
    volumes:
      - ./scripts/netbox-launch.sh:/opt/netbox/launch-netbox.sh:ro
      - ${FORGESRE_DATA:-./data}/netbox/media:/opt/netbox/netbox/media
      - ${FORGESRE_DATA:-./data}/netbox/reports:/opt/netbox/netbox/reports
      - ${FORGESRE_DATA:-./data}/netbox/scripts:/opt/netbox/netbox/scripts
    depends_on:
      postgres:
        condition: service_healthy
      netbox-db-init:
        condition: service_completed_successfully
      netbox-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${NETBOX_PORT:-8001}/login/ >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 240s
    restart: unless-stopped

  llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    profiles: ["ai"]
    network_mode: host
    command:
      - -m
      - /models/model.gguf
      - --host
      - 127.0.0.1
      - --port
      - "8088"
      - -c
      - "8192"
      - -t
      - "${FORGESRE_LLM_THREADS:-8}"
    volumes:
      - ${FORGESRE_DATA:-./data}/models:/models:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8088/v1/models"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  mailserver:
    # Optional. Off unless COMPOSE_PROFILES includes mailbox.
    # ./forgesre mailbox starts this + Roundcube. Core SMTP (Gmail/Outlook) stays
    # unchanged unless you pass --bind-core.
    image: ghcr.io/docker-mailserver/docker-mailserver:15.1.0
    profiles: ["mailbox"]
    hostname: mail.${MAIL_DOMAIN:-forgesre.local}
    stop_grace_period: 1m
    ports:
      - "25:25"
      - "127.0.0.1:587:587"
      - "993:993"
    volumes:
      - ${FORGESRE_DATA:-./data}/dms/mail-data:/var/mail
      - ${FORGESRE_DATA:-./data}/dms/mail-state:/var/mail-state
      - ${FORGESRE_DATA:-./data}/dms/mail-logs:/var/log/mail
      - ${FORGESRE_DATA:-./data}/dms/config:/tmp/docker-mailserver
      - /etc/localtime:/etc/localtime:ro
    environment:
      TZ: ${FORGESRE_TIMEZONE:-Europe/Belgrade}
      OVERRIDE_HOSTNAME: mail.${MAIL_DOMAIN:-forgesre.local}
      POSTMASTER_ADDRESS: forgesre@${MAIL_DOMAIN:-forgesre.local}
      SSL_TYPE: self-signed
      PERMIT_DOCKER: none
      ENABLE_FAIL2BAN: "0"
      ENABLE_CLAMAV: "0"
      ENABLE_RSPAMD: "0"
      ENABLE_OPENDKIM: "1"
      ENABLE_OPENDMARC: "1"
      ENABLE_UPDATE_CHECK: "0"
    networks:
      - mailbox
    healthcheck:
      test: ["CMD-SHELL", "ss --listening --tcp | grep -qE ':25|:587' || exit 1"]
      timeout: 10s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  roundcube:
    # Webmail client for the mailbox profile. ForgeSRE has no IMAP inbox.
    image: roundcube/roundcubemail:1.6.11-apache
    profiles: ["mailbox"]
    ports:
      - "${ROUNDCUBE_PORT:-8081}:80"
    environment:
      ROUNDCUBEMAIL_DEFAULT_HOST: ssl://mailserver
      ROUNDCUBEMAIL_DEFAULT_PORT: "993"
      ROUNDCUBEMAIL_SMTP_SERVER: tls://mailserver
      ROUNDCUBEMAIL_SMTP_PORT: "587"
      ROUNDCUBEMAIL_SMTP_USER: "%u"
      ROUNDCUBEMAIL_SMTP_PASS: "%p"
      ROUNDCUBEMAIL_DES_KEY: ${ROUNDCUBEMAIL_DES_KEY:-roundcube-des-key-change}
      ROUNDCUBEMAIL_DB_TYPE: sqlite
      ROUNDCUBEMAIL_UPLOAD_MAX_FILESIZE: 25M
    volumes:
      - ${FORGESRE_DATA:-./data}/roundcube/db:/var/roundcube/db
      - ./config/roundcube/custom.inc.php:/var/roundcube/config/custom.inc.php:ro
    depends_on:
      - mailserver
    networks:
      - mailbox
    restart: unless-stopped

networks:
  mailbox:
    name: forgesre-mailbox
