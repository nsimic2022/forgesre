<td class="col-status"><span class="status-cell">{% set primary = incident_status_primary(item.status, item.severity) %}<span class="status-line"><span class="pill {{ primary.pill }}">{{ primary.label }}</span></span>{% if incident_status_maintenance(item) %}<span class="status-line"><span class="pill warn" data-maint-badge{% if item.asset and maintenance_label(item.asset) %} title="{{ maintenance_label(item.asset) }}"{% endif %}>Maintenance</span></span>{% endif %}{% if item.ack_at %}<span class="status-ack">Acknowledged</span>{% endif %}</span></td>
