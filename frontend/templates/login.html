{% extends "base.html" %}
{% block title %}Login · ForgeSRE{% endblock %}
{% block login %}
<section class="card login-card">
  <h1>ForgeSRE</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" hx-boost="false">
    <label><span class="label-line">Email or directory user name</span>
      <input type="text" name="email" value="admin@forgesre.local" autocomplete="username" required></label>
    <label>Password
      <span class="password-field" x-data="{ show: false }">
        <input :type="show ? 'text' : 'password'" type="password" name="password" required>
        <button type="button" class="password-toggle" @click="show = !show" x-text="show ? 'Hide' : 'Show'" x-cloak>Show</button>
</span>
</label>
    <button type="submit">Login</button>
</form>
  {% if sso %}<p class="muted" style="text-align:center">or</p>
  <a class="button" href="/auth/oidc/login" style="display:block;text-align:center">{{ sso }}</a>{% endif %}
</section>
{% endblock %}
