{% extends "auth_base.html" %}
{% block title %}Sign in · ForgeSRE{% endblock %}
{% block content %}
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  {% if notice %}<p class="error" role="status">{{ notice }}</p>{% endif %}
  {% if signed_in %}<form method="post" action="/logout"><button type="submit" class="button secondary">Sign out</button></form>{% else %}
  <form method="post" action="/login">
    <label>Email or directory user name
      <input type="text" name="email" autocomplete="username" required autofocus></label>
    <label>Password
      <input type="password" name="password" autocomplete="current-password" required></label>
    <button type="submit">Sign in</button>
  </form>
  {% if sso %}<p class="or">or</p>
  <a class="button secondary" href="/auth/oidc/login">{{ sso }}</a>{% endif %}{% endif %}
{% endblock %}
