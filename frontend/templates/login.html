{% extends "base.html" %}
{% block title %}Login · ForgeSRE{% endblock %}
{% block login %}
<section class="card login-card">
  <h1>ForgeSRE {% with %}{% set tip %}Sign in to the operations console.{% endset %}{% include "_info_tip.html" %}{% endwith %}</h1>
  {% if error %}<p class="error">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label><span class="label-line">Email {% with %}{% set tip %}Install admin email is in secrets/secrets.env on the VM (never shown here). Passwords are bcrypt hashes in Postgres.{% endset %}{% include "_info_tip.html" %}{% endwith %}</span>
      <input type="email" name="email" value="admin@forgesre.local" required></label>
    <label>Password
      <span class="password-field" x-data="{ show: false }">
        <input :type="show ? 'text' : 'password'" type="password" name="password" required>
        <button type="button" class="password-toggle" @click="show = !show" x-text="show ? 'Hide' : 'Show'" x-cloak>Show</button>
      </span>
    </label>
    <button type="submit">Login</button>
  </form>
</section>
{% endblock %}
