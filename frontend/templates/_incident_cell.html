<td class="inc-cell">
  <a class="inc-title sev-{{ severity_pill(item.severity) }}" href="/incidents/{{ item.number }}"{% if item.title %} title="{{ item.title }}"{% endif %} tabindex="-1">{{ item.title or item.number }}</a>
  <div class="inc-meta">
    <a class="{{ incident_tone(item.status, item.severity) }}" href="/incidents/{{ item.number }}" title="{{ item.number }}">{{ incident_short_label(item.number) }}</a>
    {% set host = incident_host(item) %}
    {% if host %}<span class="inc-host">· {{ host }}</span>{% endif %}
    {% if is_demo_incident(item) %}<span class="inc-demo" title="Lab demo incident">· DEMO</span>{% endif %}
  </div>
</td>
