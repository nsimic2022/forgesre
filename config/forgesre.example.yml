schema_version: 1
# Only keys Core reads are listed. Service URLs and ports (PROMETHEUS_URL,
# ALERTMANAGER_URL, LOKI_URL, GRAFANA_PORT, FORGESRE_HTTP_PORT, NETBOX_URL) come
# from docker-compose.yml + .env. Passwords and tokens: secrets/secrets.env.

system:
  timezone: Europe/Belgrade # FORGESRE_TIMEZONE in .env wins
  log_level: info
  cookie_secure: false # true when Core is served over HTTPS (or set FORGESRE_COOKIE_SECURE=1)

inventory:
  provider: local # local inventory is SoT; NetBox is read-sync
  netbox:
    enabled: true
    mode: bundled # only "disabled" is read: it turns NetBox sync off
    url: "http://127.0.0.1:8001" # override with --netbox-url / an external instance
    auto_sync: true # read-only sync ~30 s after Core start, then every 6 h; false = only the Sync NetBox button
  zabbix:
    # Read-only. On when ZABBIX_URL + ZABBIX_API_TOKEN are in secrets/secrets.env (url here overrides ZABBIX_URL).
    # enabled: false        # force off even with secrets set
    # url: "https://zabbix.example.local/zabbix"
    auto_sync: false # true = host import with the 6 h discovery loop; false = only Discovery → Sync hosts
    timeout_seconds: 4 # per API call, clamped 2–5; a dead Zabbix backs off 2 min instead of retrying

discovery:
  enabled: true
  mode: semi-automatic # manual | semi-automatic | automatic
  cidrs: []

monitoring:
  snmp:
    enabled: true
    exporter_url: http://127.0.0.1:9116
    module: if_mib

logging:
  loki:
    enabled: true # false = no Loki evidence in RCA and Loki / Alloy doctor rows show disabled

grafana:
  enabled: true # Health "Open Grafana" + doctor row; port is GRAFANA_PORT in .env

ai:
  enabled: false
  llm:
    mode: disabled # bundled | external | disabled — fetch-llm sets bundled
    url: http://127.0.0.1:8088/v1
    model: local
    timeout_seconds: 90 # lab 4B; raise toward 600 only for slow 14B CPU rewrites
  rca:
    window_minutes: 30
    max_log_lines: 20

notifications:
  email:
    enabled: false
    host: smtp.local
    port: 587
    from: forgesre@example.local
    tls: true
    # Gmail now:        host smtp.gmail.com port 587 tls true + SMTP_* secrets
    # Outlook / M365:   host smtp.office365.com port 587 tls true + SMTP_* secrets
    # Own domain later: Compose profile mailbox (./forgesre mailbox) — does not rewrite this block
    # Host postfix:     host 127.0.0.1 (optional; Core can submit to local Postfix)
