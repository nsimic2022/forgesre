schema_version: 1
# Only keys Core reads are listed. Service URLs and ports (PROMETHEUS_URL,
# ALERTMANAGER_URL, LOKI_URL, GRAFANA_PORT, FORGESRE_HTTP_PORT, NETBOX_URL) come
# from docker-compose.yml + .env. Passwords and tokens: secrets/secrets.env.

system:
  timezone: Europe/Belgrade # FORGESRE_TIMEZONE in .env wins
  log_level: info
  cookie_secure: false # true when Core is served over HTTPS (or set FORGESRE_COOKIE_SECURE=1)

inventory:
  provider: local # local inventory is SoT; NetBox is read-sync
  new_from_sources: add # add = new GLPI / Zabbix / NetBox devices go straight into inventory; review = listed in Discovery first
  netbox:
    enabled: true
    mode: bundled # only "disabled" is read: it turns NetBox sync off
    url: "http://127.0.0.1:8001" # override with --netbox-url / an external instance
    auto_sync: true # read-only sync ~30 s after Core start, then every 6 h; false = only the Sync NetBox button
  zabbix:
    # Read-only. On when ZABBIX_URL + ZABBIX_API_TOKEN are in secrets/secrets.env (url here overrides ZABBIX_URL).
    # enabled: false        # force off even with secrets set
    # url: "https://zabbix.example.local/zabbix"
    auto_sync: false # true = host import with the 6 h discovery loop; false = only Discovery → Sync hosts
    timeout_seconds: 4 # per API call, clamped 2–5; a dead Zabbix backs off 2 min instead of retrying
    flow_watch: true # check the Zabbix flow every 15 min; a block that breaks goes to the journal (Settings › Integrations › Zabbix › Flow and log)
    flow_ai: true # with ForgeAI on, it analyses a new break by itself (local model)
  glpi:
    # Read-only. On when GLPI_URL + GLPI_APP_TOKEN + GLPI_USER_TOKEN are in secrets/secrets.env (url here overrides GLPI_URL).
    # enabled: false        # force off even with secrets set
    # url: "https://glpi.example.local/glpi"
    auto_sync: false # true = import with the 6 h discovery loop; false = only Discovery → Sync hosts
    timeout_seconds: 4 # per API call, clamped 2–5; a dead GLPI backs off 2 min instead of retrying
  librenms:
    # Bundled. Discovery SNMP Identify adds the IP here, reads ports/sensors, then disables LibreNMS polling
    # so snmp_exporter remains the Prometheus collector. Token: LIBRENMS_API_TOKEN in secrets/secrets.env.
    enabled: true
    url: "http://127.0.0.1:8000"
    timeout_seconds: 8 # add-device can wait on SNMP; clamped 2–15

discovery:
  enabled: true
  # Devices come from LibreNMS (ForgeSRE never scans networks). Ranges: ./forgesre discovery nets CIDR
  mode: semi-automatic # manual | semi-automatic (list in Add devices) | automatic (add at once)

monitoring:
  snmp:
    enabled: true
    exporter_url: http://127.0.0.1:9116
    module: if_mib

logging:
  loki:
    enabled: true # false = no Loki evidence in RCA and Loki / Alloy doctor rows show disabled

grafana:
  enabled: true # Health "Open Grafana" + doctor row; port is GRAFANA_PORT in .env

ai:
  enabled: false
  llm:
    mode: disabled # bundled | external | disabled — fetch-llm sets bundled
    url: http://127.0.0.1:8088/v1
    model: local
    timeout_seconds: 90 # lab 4B; raise toward 600 only for slow 14B CPU rewrites
  cloud: # optional paid model; off = nothing leaves the server. Key: ./forgesre settings set-secret CLOUD_LLM_API_KEY
    enabled: false
    provider: openai # openai | anthropic | azure | openai-compatible
    model: gpt-4o-mini
  embed: # document search: local embeddings (nomic-embed-text, ./forgesre fetch-llm)
    enabled: true
    url: http://127.0.0.1:8089/v1
  rca:
    window_minutes: 30
    max_log_lines: 20

alerts:
  # Alarm storm: this many new incidents within the window open one "Alarm storm" incident that
  # pages once; the rest link to it and do not page one by one.
  storm:
    enabled: true
    threshold: 20
    window_minutes: 5
  # Flapping: an alert that opens this many incidents within the window stays visible but stops paging.
  flapping:
    enabled: true
    threshold: 3
    window_minutes: 60

# SLA targets in minutes: response = acknowledged, resolve = resolved. Shown on incidents and reports.
sla:
  enabled: true
  response: {critical: 15, high: 30, warning: 120}
  resolve: {critical: 240, high: 480, warning: 1440}

notifications:
  email:
    enabled: false
    host: smtp.local
    port: 587
    from: forgesre@example.local
    tls: true
    # Gmail now:        host smtp.gmail.com port 587 tls true + SMTP_* secrets
    # Outlook / M365:   host smtp.office365.com port 587 tls true + SMTP_* secrets
    # Own domain later: Compose profile mailbox (./forgesre mailbox) — does not rewrite this block
    # Host postfix:     host 127.0.0.1 (optional; Core can submit to local Postfix)
  # Chat: posts when an incident opens, escalates and resolves (only the incident line).
  # Webhook URLs are secrets: ./forgesre settings set-secret SLACK_WEBHOOK_URL (and TEAMS_, DISCORD_).
  chat:
    slack:
      enabled: false
      min_severity: high
    teams:
      enabled: false
      min_severity: high
    discord:
      enabled: false
      min_severity: high

# Which UI opens at / after sign-in: new (the React UI at /app) or classic. /classic always works.
ui:
  home: new

# Kubernetes / OpenShift / k3s clusters, read-only (docs/kubernetes.md). Token per cluster:
#   ./forgesre settings set-secret K8S_TOKEN_<NAME>
kubernetes:
  clusters: []
