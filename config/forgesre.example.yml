schema_version: 1

system:
  mode: online # online | offline
  timezone: Europe/Belgrade
  log_level: info
  cookie_secure: false # true when Core is served over HTTPS (or set FORGESRE_COOKIE_SECURE=1)

inventory:
  provider: local # local inventory is SoT; NetBox is read-sync
  netbox:
    enabled: true
    mode: bundled # bundled | external | disabled
    url: "http://127.0.0.1:8001" # override with --netbox-url / an external instance

discovery:
  enabled: true
  mode: semi-automatic # manual | semi-automatic | automatic
  cidrs: []

monitoring:
  prometheus:
    enabled: true
    mode: bundled
    url: http://127.0.0.1:9090
  alertmanager:
    enabled: true
    mode: bundled
    url: http://127.0.0.1:9093
  snmp:
    enabled: true
    exporter_url: http://127.0.0.1:9116
    module: if_mib

logging:
  loki:
    enabled: true
    mode: bundled
    url: http://127.0.0.1:3100
  alloy:
    enabled: true

grafana:
  enabled: true
  mode: bundled
  url: http://127.0.0.1:3000

ai:
  enabled: false
  provider: local
  llm:
    mode: disabled # bundled | external | disabled — fetch-llm sets bundled
    url: http://127.0.0.1:8088/v1
    model: local
    timeout_seconds: 90 # lab 4B; raise toward 600 only for slow 14B CPU rewrites
  rca:
    engine: forgerca
    window_minutes: 30
    max_log_lines: 20
    max_evidence: 40

notifications:
  email:
    enabled: false
    host: smtp.local
    port: 587
    from: forgesre@example.local
    tls: true
    # Gmail now:        host smtp.gmail.com port 587 tls true + SMTP_* secrets
    # Outlook / M365:   host smtp.office365.com port 587 tls true + SMTP_* secrets
    # Own domain later: Compose profile mailbox (./forgesre mailbox) — does not rewrite this block
    # Host postfix:     host 127.0.0.1 (optional; Core can submit to local Postfix)
  webhook:
    enabled: false

features:
  playrules: true
  playbooks: true
  escalation: true
