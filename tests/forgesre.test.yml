# Pytest copy of the example config with AI off so tests never call llama.cpp.
schema_version: 1

system:
  mode: online # online | offline
  timezone: Europe/Belgrade
  log_level: info
  cookie_secure: false # true when Core is served over HTTPS (or set FORGESRE_COOKIE_SECURE=1)

inventory:
  provider: local # local inventory is SoT; NetBox is read-sync
  netbox:
    enabled: false
    mode: disabled
    url: ""

discovery:
  enabled: true
  mode: semi-automatic # manual | semi-automatic | automatic
  cidrs: []

monitoring:
  prometheus:
    enabled: true
    mode: bundled
    url: http://127.0.0.1:9090
  alertmanager:
    enabled: true
    mode: bundled
    url: http://127.0.0.1:9093
  snmp:
    enabled: true
    exporter_url: http://127.0.0.1:9116
    module: if_mib

logging:
  loki:
    enabled: true
    mode: bundled
    url: http://127.0.0.1:3100
  alloy:
    enabled: true

grafana:
  enabled: true
  mode: bundled
  url: http://127.0.0.1:3000

ai:
  enabled: false
  provider: local
  llm:
    mode: disabled # bundled | external | disabled
    url: http://127.0.0.1:8088/v1
    model: local
    timeout_seconds: 90
  rca:
    engine: forgerca
    window_minutes: 30
    max_log_lines: 20
    max_evidence: 40

notifications:
  email:
    enabled: false
    host: smtp.local
    port: 587
    from: forgesre@example.local
    tls: true
  webhook:
    enabled: false

features:
  playrules: true
  playbooks: true
  escalation: true
