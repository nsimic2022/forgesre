groups:
  - name: forgesre-demo
    rules:
      - alert: HighCPU
        expr: forgesre_demo_cpu_percent > 80
        for: 10s
        labels:
          severity: warning
          asset: forge-demo-01
        annotations:
          summary: "High CPU on {{ $labels.asset }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.asset }}."

      - alert: FilesystemUsageHigh
        expr: forgesre_demo_disk_percent > 80
        for: 10s
        labels:
          severity: warning
          asset: forge-demo-01
        annotations:
          summary: "Filesystem usage high on {{ $labels.asset }}"
          description: "Disk usage is {{ $value }}% on {{ $labels.asset }}."

  - name: forgesre-snmp
    rules:
      - alert: SnmpDeviceUnreachable
        expr: up{job="forgesre-snmp"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "SNMP unreachable on {{ $labels.asset }}"
          description: "snmp_exporter could not scrape {{ $labels.instance }} (community, ACL, or device down)."

      - alert: NetworkInterfaceDown
        expr: ifOperStatus == 2 and ifAdminStatus == 1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Interface down on {{ $labels.asset }}"
          description: "ifOperStatus is down while admin is up on {{ $labels.ifName }} (ifIndex {{ $labels.ifIndex }}) / {{ $labels.instance }}."

  - name: forgesre-node
    rules:
      - alert: NodeExporterDown
        expr: up{job="linux-standard"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "node_exporter down on {{ $labels.asset }}"
          description: "Prometheus cannot scrape {{ $labels.instance }} (:9100)."

      - alert: NodeFilesystemUsageHigh
        expr: 100 - (node_filesystem_avail_bytes{fstype!~"tmpfs|fuse.*|overlay",job="linux-standard"} / node_filesystem_size_bytes * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Filesystem usage high on {{ $labels.asset }}"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }} {{ $labels.mountpoint }}."

      - alert: NodeCPUHigh
        expr: 100 * (1 - avg by (asset) (rate(node_cpu_seconds_total{mode="idle",job="linux-standard"}[5m]))) > 95
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU high on {{ $labels.asset }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.asset }}."

      - alert: NodeMemoryHigh
        expr: 100 * (1 - (node_memory_MemAvailable_bytes{job="linux-standard"} / node_memory_MemTotal_bytes{job="linux-standard"})) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory high on {{ $labels.asset }}"
          description: "Memory usage is {{ $value }}% on {{ $labels.asset }}."

  - name: forgesre-windows
    rules:
      - alert: WindowsExporterDown
        expr: up{job="windows-standard"} == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "windows_exporter down on {{ $labels.asset }}"
          description: "Prometheus cannot scrape {{ $labels.instance }} (:9182)."

      - alert: WindowsFilesystemUsageHigh
        expr: 100 - (windows_logical_disk_free_bytes{volume!~"_Total",job="windows-standard"} / windows_logical_disk_size_bytes * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Volume usage high on {{ $labels.asset }}"
          description: "Disk usage is {{ $value }}% on {{ $labels.instance }} volume {{ $labels.volume }}."

      - alert: WindowsCPUHigh
        expr: 100 - (avg by (asset) (rate(windows_cpu_time_total{mode="idle",job="windows-standard"}[5m])) * 100) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Windows CPU high on {{ $labels.asset }}"
          description: "CPU usage is {{ $value }}% on {{ $labels.asset }}."

      - alert: WindowsMemoryHigh
        expr: 100 * (1 - (windows_os_physical_memory_free_bytes{job="windows-standard"} / windows_cs_physical_memory_bytes{job="windows-standard"})) > 90
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Windows memory high on {{ $labels.asset }}"
          description: "Memory usage is {{ $value }}% on {{ $labels.asset }}."
